name: Bug report
description: Something in Whasp is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got. A short snippet that reproduces it helps most.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Whasp version
      description: Output of `whasp --version` or `pip show whasp`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      description: For example Python 3.12 on Ubuntu 24.04.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options: [Web panel (browser), Terminal app, CLI, Extensions, Install / packaging, Other]
  - type: textarea
    id: logs
    attributes:
      label: Output, audit log lines or browser console errors
      render: text
  - type: markdown
    attributes:
      value: Please remove private data from logs before pasting them.
